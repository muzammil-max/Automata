<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Automata architecture" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="14" fill="#0d1117"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- boxes -->
    <rect x="30" y="130" width="150" height="90" rx="12" fill="#47848F"/>
    <text x="105" y="168" font-size="18" font-weight="700" fill="#fff">Frontend</text>
    <text x="105" y="192" font-size="13" fill="#e6f2f4">Electron app</text>
    <text x="105" y="208" font-size="12" fill="#e6f2f4">what you see</text>

    <rect x="260" y="130" width="150" height="90" rx="12" fill="#00599C"/>
    <text x="335" y="168" font-size="18" font-weight="700" fill="#fff">Backend</text>
    <text x="335" y="192" font-size="13" fill="#dcecff">C++17 server</text>
    <text x="335" y="208" font-size="12" fill="#dcecff">the brain</text>

    <rect x="490" y="130" width="150" height="90" rx="12" fill="#555b63"/>
    <text x="565" y="168" font-size="18" font-weight="700" fill="#fff">ChromeDriver</text>
    <text x="565" y="192" font-size="13" fill="#eee">WebDriver</text>
    <text x="565" y="208" font-size="12" fill="#eee">the steering wheel</text>

    <rect x="720" y="130" width="150" height="90" rx="12" fill="#4285F4"/>
    <text x="795" y="168" font-size="18" font-weight="700" fill="#fff">Chrome</text>
    <text x="795" y="192" font-size="13" fill="#e8f0ff">Chromium</text>
    <text x="795" y="208" font-size="12" fill="#e8f0ff">the actual car</text>

    <rect x="260" y="290" width="150" height="70" rx="12" fill="#76B900"/>
    <text x="335" y="320" font-size="18" font-weight="700" fill="#10200a">NVIDIA AI</text>
    <text x="335" y="342" font-size="13" fill="#1d3a0d">Nemotron model</text>

    <!-- arrows -->
    <line x1="184" y1="175" x2="256" y2="175" stroke="#8b949e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="220" y="160" font-size="11" fill="#8b949e">HTTP/JSON</text>
    <text x="220" y="196" font-size="11" fill="#8b949e">:8080</text>

    <line x1="414" y1="175" x2="486" y2="175" stroke="#8b949e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="644" y1="175" x2="716" y2="175" stroke="#8b949e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>

    <line x1="335" y1="224" x2="335" y2="286" stroke="#8b949e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="365" y="260" font-size="11" fill="#8b949e" text-anchor="start">HTTPS</text>

    <text x="450" y="60" font-size="16" fill="#c9d1d9" font-weight="600">Everything runs locally except the AI call</text>
    <text x="450" y="84" font-size="13" fill="#8b949e">You click, the backend thinks, Chrome acts</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
