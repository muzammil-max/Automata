<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Automata banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="0.6" stop-color="#1a4fa8"/>
      <stop offset="1" stop-color="#2b7bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <!-- app icon motif -->
  <g transform="translate(90,60)">
    <rect x="0" y="0" width="180" height="180" rx="16" fill="#0e3a85" stroke="#f2e8d5" stroke-width="0" />
    <rect x="22" y="30" width="136" height="110" fill="none" stroke="#f2e8d5" stroke-width="8"/>
    <line x1="22" y1="55" x2="158" y2="55" stroke="#f2e8d5" stroke-width="8"/>
    <rect x="52" y="78" width="20" height="20" fill="#f2e8d5"/>
    <rect x="36" y="104" width="20" height="20" fill="#f2e8d5"/>
    <path d="M90 100 h26 v-12 l30 24 -30 24 v-12 h-26 z" fill="#f5a623"/>
  </g>
  <text x="320" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">Automata</text>
  <text x="324" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#cfe3ff">The AI browser agent that lives on your desktop</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="324" y="218" width="110" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="379" y="244" text-anchor="middle" fill="#fff">Chat</text>
    <rect x="450" y="218" width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="515" y="244" text-anchor="middle" fill="#fff">Browse</text>
    <rect x="596" y="218" width="110" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="651" y="244" text-anchor="middle" fill="#fff">Draw</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
