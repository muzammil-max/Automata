[package]
name = "automata-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Automata fast browser engine (CDP, WebDriver-compatible facade)"

[[bin]]
name = "automata-browser"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
base64 = "0.22"
dirs = "5"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
