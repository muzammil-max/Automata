<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Automata — Home</title>
<meta name="description" content="Automata — a thinking, pixel-eyed browser agent." />
<meta name="theme-color" content="#05060f" />

<!-- Link preview (WhatsApp / X / Discord / Slack etc.) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Automata" />
<meta property="og:title" content="Automata" />
<meta property="og:description" content="A little agent that thinks, clicks, and draws." />
<meta property="og:url" content="https://automata-app.vercel.app/" />
<meta property="og:image" content="https://automata-app.vercel.app/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Automata" />
<meta name="twitter:description" content="A little agent that thinks, clicks, and draws." />
<meta name="twitter:image" content="https://automata-app.vercel.app/preview.png" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== backdrop ===================== -->
  <div class="backdrop" aria-hidden="true">
    <div class="nebula nebula--one"></div>
    <div class="nebula nebula--two"></div>
    <div class="stars" id="stars"></div>
    <div class="backdrop-glow"></div>
    <div class="vignette"></div>
  </div>

  <!-- ===================== hero ===================== -->
  <main class="stage">

    <!-- Pixel cursor with eyes + thought bubble -->
    <div class="cursor-wrap" id="cursor-wrap" aria-hidden="true">
      <div class="thought">
        <span class="thought-dot"></span>
        <span class="thought-dot"></span>
        <span class="thought-dot"></span>
      </div>

      <div class="zzz" aria-hidden="true">
        <span>z</span><span>z</span><span>z</span>
      </div>

      <div class="cursor" id="cursor">
        <div class="pixel-grid" id="pixel-grid"></div>

        <!-- Eyes are separate so they can blink and look around. -->
        <div class="eye eye-left" id="eye-left">
          <span class="pupil"></span>
        </div>
        <div class="eye eye-right" id="eye-right">
          <span class="pupil"></span>
        </div>
      </div>
    </div>

    <!-- Wordmark -->
    <h1 class="wordmark" id="wordmark" data-en="Automata">Automata</h1>
    <p class="tagline">A little agent that thinks, clicks, and draws.</p>
  </main>

  <!-- ===================== music bar ===================== -->
  <footer class="music-bar">
    <button type="button" class="music-btn" id="music-btn" aria-label="Play music">
      <svg class="icon-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M4 2.6v10.8L13 8z" fill="currentColor" />
      </svg>
      <svg class="icon-pause hidden" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor" />
      </svg>
    </button>

    <div class="track-copy">
      <span class="track-title" id="track-title">Music off</span>
      <span class="track-sub" id="track-sub">Looking for tracks…</span>
    </div>

    <div class="equalizer" id="equalizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </footer>

  <!-- HTML preview modal -->
  <div class="html-preview-overlay" id="htmlPreviewOverlay" hidden>
    <div class="html-preview-modal" role="dialog" aria-modal="true" aria-label="HTML preview">
      <div class="html-preview-head">
        <span class="html-preview-title">index.html</span>
        <div class="html-preview-actions">
          <button type="button" class="html-preview-copy" id="htmlPreviewCopy">Copy</button>
          <button type="button" class="html-preview-close" id="htmlPreviewClose" aria-label="Close">&times;</button>
        </div>
      </div>
      <pre class="html-preview-code" id="htmlPreviewCode"></pre>
    </div>
  </div>

  <audio id="audio" preload="auto" autoplay></audio>

  <!-- Floating HTML preview button -->
  <button type="button" class="html-preview-fab" id="htmlPreviewFab" aria-label="Open HTML preview" title="HTML preview">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
      <path d="M7.5 1.2h-2.6v6.6H4.2V1.2h3.4zM6.8 8.4h-2.6v6.6h2.6V8.4zm4.7 0h-2.6v6.6h2.6V8.4z" />
    </svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
